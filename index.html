<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kick Daily Sub Counter — Overlay</title>
<style>
  :root {
    --accent: #53fc18;
    --text: #ffffff;
    --shadow: rgba(0,0,0,0.85);
    --num-size: 72px;
    --label-size: 26px;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #widget {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 4px; user-select: none;
  }
  #line {
    display: flex; align-items: baseline; justify-content: center;
    gap: 14px; flex-wrap: wrap;
  }
  #label {
    color: var(--text); font-size: var(--label-size); font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase;
    text-shadow:-2px -2px 0 var(--shadow),2px -2px 0 var(--shadow),-2px 2px 0 var(--shadow),2px 2px 0 var(--shadow),0 2px 4px var(--shadow);
  }
  #score { font-size: var(--num-size); font-weight: 900; line-height: 1;
    text-shadow:-3px -3px 0 var(--shadow),3px -3px 0 var(--shadow),-3px 3px 0 var(--shadow),3px 3px 0 var(--shadow),0 4px 8px var(--shadow);
  }
  #count { color: var(--accent); transition: transform 0.18s ease; display: inline-block; }
  #count.bump { transform: scale(1.3); }
  #sep, #goal { color: var(--text); }
  #bar {
    width: min(80vw, 420px); height: 12px; margin-top: 10px;
    background: rgba(255,255,255,0.18); border-radius: 999px; overflow: hidden;
    box-shadow: 0 2px 6px var(--shadow);
  }
  #barfill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
  #goalMet { color: var(--accent); font-weight: 800; font-size: var(--label-size);
    text-shadow:-2px -2px 0 var(--shadow),2px -2px 0 var(--shadow),-2px 2px 0 var(--shadow),2px 2px 0 var(--shadow); }
  #status {
    position: fixed; left: 8px; bottom: 8px; font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,0.6);
    color: #ffd54a; max-width: 92vw; display: none;
  }
  #status.show { display: block; }
  #status.ok { color: #53fc18; } #status.err { color: #ff5a5a; } #status.warn { color: #ffd54a; }
</style>
</head>
<body>
  <div id="widget">
    <div id="line">
      <span id="label">Daily Subs</span>
      <span id="score"><span id="count">0</span><span id="sep"> / </span><span id="goal">5</span></span>
    </div>
    <div id="bar"><div id="barfill"></div></div>
    <div id="goalMet" style="display:none">🎉 Goal reached!</div>
  </div>
  <div id="status"></div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="store.js"></script>
  <script src="kick.js"></script>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(location.search);
    var channel = (params.get("channel") || "boyking").trim().toLowerCase();
    var chatroomOverride = (params.get("chatroom_id") || "").trim();
    var showBar = params.get("bar") !== "0";

    // Styling overrides
    var root = document.documentElement.style;
    if (params.get("color")) root.setProperty("--accent", params.get("color"));
    if (params.get("size")) root.setProperty("--num-size", params.get("size"));
    if (params.get("labelsize")) root.setProperty("--label-size", params.get("labelsize"));

    var elCount = document.getElementById("count");
    var elGoal = document.getElementById("goal");
    var elLabel = document.getElementById("label");
    var elBar = document.getElementById("bar");
    var elBarFill = document.getElementById("barfill");
    var elGoalMet = document.getElementById("goalMet");
    var elStatus = document.getElementById("status");

    if (params.get("label") != null) elLabel.textContent = params.get("label");
    if (elLabel.textContent === "") elLabel.style.display = "none";
    if (!showBar) elBar.style.display = "none";

    var statusTimer = null;
    function setStatus(text, kind) {
      clearTimeout(statusTimer);
      if (!text) { elStatus.className = ""; elStatus.textContent = ""; return; }
      elStatus.textContent = text;
      elStatus.className = "show " + (kind || "");
      if (kind === "ok") statusTimer = setTimeout(function () { elStatus.className = ""; }, 3500);
    }

    var lastCount = 0;
    function render(state) {
      elGoal.textContent = state.goal;
      if (state.count !== lastCount) {
        elCount.textContent = state.count;
        elCount.classList.remove("bump"); void elCount.offsetWidth; elCount.classList.add("bump");
        lastCount = state.count;
      } else {
        elCount.textContent = state.count;
      }
      var pct = state.goal > 0 ? Math.min(100, (state.count / state.goal) * 100) : 0;
      elBarFill.style.width = pct + "%";
      elGoalMet.style.display = (state.goal > 0 && state.count >= state.goal) ? "block" : "none";
    }

    var store = SubStore.create(channel);
    store.onStatus(setStatus);
    store.subscribe(render);

    // Only the overlay listens to Kick and writes live increments — this keeps
    // the count from being double-added by the control panel.
    KickGiftListener.start(channel, chatroomOverride, function (qty) {
      store.addCount(qty);
    }, setStatus);
  })();
  </script>
</body>
</html>
