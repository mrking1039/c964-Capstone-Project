name: Deploy to GitHub Pages

# Publishes the counter (overlay + control panel) to GitHub Pages on every push
# to the working branch. The configure-pages step self-enables Pages on the
# first successful run, so no manual Settings toggle is needed.

# NOTE: GitHub Pages requires a PUBLIC repo (or a paid plan). Once the repo is
# public this workflow self-enables Pages and publishes on every push. If it
# ever needs a manual kick, use the Actions tab → "Run workflow".
on:
  workflow_dispatch:
  push:
    branches:
      - claude/kick-gifted-sub-counter-rtxo2s
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
