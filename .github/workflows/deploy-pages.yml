name: Deploy to GitHub Pages

# Publishes the counter (overlay + control panel) to GitHub Pages on every push
# to the working branch. The configure-pages step self-enables Pages on the
# first successful run, so no manual Settings toggle is needed.

# NOTE: GitHub Pages requires a PUBLIC repo (or a paid plan). While this repo is
# private on a free plan, the deploy will fail, so auto-run on push is disabled.
# Make the repo public (Settings → General → Danger Zone → Change visibility),
# then run this workflow once from the Actions tab ("Run workflow") to publish.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
